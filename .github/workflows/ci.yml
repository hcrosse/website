name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
          # Fail instead of resolving unpinned versions when mise.lock is missing.
          install_args: --locked

      - name: Install dependencies
        run: mise run deps

      # The site build needs private fonts that CI does not have.
      - parallel:
          - name: Lint
            run: mise run lint
          - name: Test
            run: mise run test
          - name: Audit
            run: mise run audit
